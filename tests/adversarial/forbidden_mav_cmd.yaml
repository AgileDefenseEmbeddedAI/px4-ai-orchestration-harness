name: "Forbidden MAV_CMD for Vehicle Class"
description: "Rover waypoint uses MAV_CMD_NAV_TAKEOFF which is forbidden for ground vehicles"
mig:
  version: "1.0"
  mission_id: "MSN-ADV008"
  intent: "Rover attempts takeoff — invalid command"
  vehicles:
    - id: GND-1
      vehicle_type: rover
      sitl_target: gz_rover_ackermann
      mavlink_sysid: 1
      waypoints: ["WP-1", "WP-RTL"]
  waypoints:
    - id: WP-1
      lat: 35.1490
      lon: -79.0100
      alt_m: 0.0
      role: survey
      mav_cmd: MAV_CMD_NAV_TAKEOFF
    - id: WP-RTL
      lat: 35.1400
      lon: -79.0110
      alt_m: 0.0
      role: rtl
  constraints:
    max_alt_m: 120.0
    min_alt_m: 5.0
    require_rtl: true
    max_range_m: 5000.0
expected_valid: false
expected_error_contains: "VIOL-FORBIDDEN-CMD"
