name: "Altitude Too Low (Aerial Vehicle)"
description: "Multirotor waypoint below minimum 5m altitude — must be rejected"
mig:
  version: "1.0"
  mission_id: "MSN-ADV004"
  intent: "Low altitude recon sweep"
  vehicles:
    - id: UAV-1
      vehicle_type: multirotor
      sitl_target: gz_x500
      mavlink_sysid: 1
      waypoints: ["WP-1", "WP-RTL"]
  waypoints:
    - id: WP-1
      lat: 35.1490
      lon: -79.0100
      alt_m: 1.0
      role: survey
    - id: WP-RTL
      lat: 35.1400
      lon: -79.0110
      alt_m: 30.0
      role: rtl
  constraints:
    max_alt_m: 120.0
    min_alt_m: 5.0
    require_rtl: true
    max_range_m: 5000.0
expected_valid: false
expected_error_contains: "below"
