<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Brand" subtitle="Red accents and navy canvas" viewport="700x300" -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-page);color:var(--fg-primary);font-family:var(--font-primary);}
  .wrap{padding:32px;display:flex;flex-direction:column;gap:24px;}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .swatch{
    width:140px;height:110px;display:flex;flex-direction:column;justify-content:flex-end;
    padding:12px;color:#fff;font-size:12px;line-height:1.3;
  }
  .swatch .name{font-weight:700;font-size:13px;}
  .swatch .hex{opacity:.85;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.02em;}
  .group-label{
    font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--color-blue-light);
    font-weight:700;margin-bottom:-8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="group-label">Brand reds</div>
  <div class="row">
    <div class="swatch" style="background:#d23c3a"><div class="name">Red Primary</div><div class="hex">#D23C3A</div></div>
    <div class="swatch" style="background:#c24841"><div class="name">Red Dark</div><div class="hex">#C24841</div></div>
    <div class="swatch" style="background:#ff5a58"><div class="name">Red Bright</div><div class="hex">#FF5A58</div></div>
  </div>
  <div class="group-label">Navy canvas</div>
  <div class="row">
    <div class="swatch" style="background:#061033"><div class="name">Navy Deepest</div><div class="hex">#061033</div></div>
    <div class="swatch" style="background:#0b2451"><div class="name">Navy Deep</div><div class="hex">#0B2451</div></div>
    <div class="swatch" style="background:#1f3864"><div class="name">Navy Mid</div><div class="hex">#1F3864</div></div>
  </div>
</div>
</body>
</html>
