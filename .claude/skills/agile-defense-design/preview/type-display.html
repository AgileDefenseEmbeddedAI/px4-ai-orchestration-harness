<!doctype html>

<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#061033;color:#fff;font-family:var(--font-primary);}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:baseline;gap:20px;}
  .label{width:100px;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#a9d8fb;font-weight:700;flex-shrink:0;}
  .meta{font-size:11px;color:rgba(255,255,255,.5);font-family:ui-monospace,Menlo,monospace;margin-left:auto;flex-shrink:0;}
  .sample{line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><div class="label">Hero</div><div class="sample" style="font-size:72px;font-weight:500;color:#c24841">Always</div><div class="meta">125/500</div></div>
  <div class="row"><div class="label">Display</div><div class="sample" style="font-size:56px;font-weight:500">91%</div><div class="meta">96/500</div></div>
  <div class="row"><div class="label">H1</div><div class="sample" style="font-size:40px;font-weight:700">Mission Impact</div><div class="meta">64/700</div></div>
  <div class="row"><div class="label">H2</div><div class="sample" style="font-size:28px;font-weight:700">We Fix the Problems</div><div class="meta">40/700</div></div>
</div>
</body>
</html>
