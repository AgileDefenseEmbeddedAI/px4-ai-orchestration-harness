<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PX4 Harness{% endblock %} — Agile Defense</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --red:     #d23c3a;
  --navy-d:  #061033;
  --navy:    #0b2451;
  --navy-m:  #1f3864;
  --white:   #ffffff;
  --black:   #000000;
  --muted:   rgba(255,255,255,0.65);
  --border:  rgba(255,255,255,0.1);
  --font:    'Helvetica Neue', Helvetica, Arial, sans-serif;
  --nav-h:   52px;
}
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--navy-d);
  color: var(--white);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* NAV */
.nav {
  height: var(--nav-h);
  background: var(--black);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-brand { display: flex; align-items: center; gap: 16px; }
.nav-logo { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; color: var(--white); }
.nav-sep { width: 1px; height: 20px; background: var(--border); }
.nav-product { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
.nav-links { display: flex; gap: 0; }
.nav-link {
  font-size: 12px; font-weight: 500; color: var(--muted);
  padding: 0 14px; height: var(--nav-h); display: flex; align-items: center;
  letter-spacing: 0.04em; text-transform: uppercase;
}
.nav-link:hover { color: var(--white); }
.nav-link-cta { background: var(--red); color: var(--white); padding: 0 16px; }
.nav-link-cta:hover { opacity: 0.9; }

/* CONTENT */
.content { max-width: 1200px; margin: 0 auto; padding: 48px 32px; }

/* STATUS BADGE */
.badge {
  display: inline-block;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.badge-planning    { background: var(--navy-m); color: var(--white); }
.badge-valid       { background: #1a4a1a; color: #4caf50; }
.badge-failed      { background: #4a1a1a; color: var(--red); }
.badge-pending     { background: #4a3a1a; color: #efb16a; }
.badge-authorized  { background: #1a3a4a; color: #a9d8fb; }
.badge-dispatched  { background: #1a4a1a; color: #4caf50; }

/* CARD */
.card {
  background: var(--navy);
  padding: 24px;
  margin-bottom: 16px;
}
.card-title { font-size: 18px; font-weight: 500; margin-bottom: 16px; }

/* TABLE */
.table { width: 100%; border-collapse: collapse; }
.table th {
  text-align: left; padding: 8px 12px; font-size: 11px;
  font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); border-bottom: 1px solid var(--border);
}
.table td {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  font-size: 14px; vertical-align: top;
}
.table tr:last-child td { border-bottom: none; }
.mono { font-family: 'Courier New', monospace; font-size: 12px; color: #a9d8fb; }

/* BTN */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 40px; padding: 0 20px;
  font-family: var(--font); font-size: 12px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase;
  border: none; cursor: pointer;
}
.btn-red   { background: var(--red); color: var(--white); }
.btn-red:hover { opacity: 0.85; }
.btn-outline { background: transparent; color: var(--white); border: 1px solid var(--border); }
.btn-outline:hover { border-color: rgba(255,255,255,0.3); }

/* FORM */
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 11px; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}
.field input[type=text] {
  width: 100%; height: 40px; padding: 0 12px;
  background: var(--navy-d); border: 1px solid var(--border);
  color: var(--white); font-family: var(--font); font-size: 14px; outline: none;
}
.field input[type=text]:focus { border-color: rgba(255,255,255,0.3); }

/* SECTION HEADER */
.section-head { margin-bottom: 32px; }
.section-eye { font-size: 11px; font-weight: 500; color: var(--red); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
.section-title { font-size: 28px; font-weight: 700; line-height: 1.2; }

/* ALERT */
.alert { padding: 12px 16px; margin-bottom: 16px; border-left: 3px solid; }
.alert-success { border-color: #4caf50; background: #1a4a1a; }
.alert-error   { border-color: var(--red); background: #4a1a1a; }
.alert-info    { border-color: #a9d8fb; background: var(--navy); }

/* FOOTER */
.footer {
  background: var(--black);
  border-top: 1px solid var(--border);
  padding: 24px 32px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 64px;
}
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav class="nav">
  <div class="nav-brand">
    <span class="nav-logo">AGILE DEFENSE</span>
    <div class="nav-sep"></div>
    <span class="nav-product">PX4 AI Harness</span>
  </div>
  <div class="nav-links">
    <a href="/ui" class="nav-link">Missions</a>
    <a href="/docs" class="nav-link">API Docs</a>
    <a href="/ui" class="nav-link nav-link-cta">New Mission</a>
  </div>
</nav>

<div class="content">
  {% block content %}{% endblock %}
</div>

<footer class="footer">
  Agile Defense — PX4 AI Orchestration Harness v0.1.0 — Prototype
</footer>
</body>
</html>
