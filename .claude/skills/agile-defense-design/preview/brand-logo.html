<!doctype html>
<!-- @dsCard group="Brand" name="Brand — Logo" subtitle="Mark on dark and on light" viewport="700x200" -->
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#061033;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#fff;}
  .wrap{padding:32px;display:flex;gap:24px;align-items:center;justify-content:center;}
  .logo-mark{background:#ffffff08;padding:24px 28px;display:flex;align-items:center;justify-content:center;}
  img{display:block;height:60px;width:auto;}
  .label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#a9d8fb;font-weight:700;margin-top:8px;text-align:center;}
  .col{display:flex;flex-direction:column;align-items:center;gap:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <div class="logo-mark" style="background:#061033"><img src="../assets/logo.svg"></div>
    <div class="label">On dark</div>
  </div>
  <div class="col">
    <div class="logo-mark" style="background:#ffffff"><img src="../assets/logo-invert.svg"></div>
    <div class="label">On light</div>
  </div>
</div>
</body>
</html>
