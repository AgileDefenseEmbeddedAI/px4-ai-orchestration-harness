name: "Out-of-Order Waypoint Timestamps"
description: "Second waypoint has an earlier t_s than the first — physically impossible sequence"
mig:
  version: "1.0"
  mission_id: "MSN-ADV007"
  intent: "Time-traveling UAV mission"
  vehicles:
    - id: UAV-1
      vehicle_type: multirotor
      sitl_target: gz_x500
      mavlink_sysid: 1
      waypoints: ["WP-1", "WP-2", "WP-RTL"]
  waypoints:
    - id: WP-1
      lat: 35.1490
      lon: -79.0100
      alt_m: 50.0
      role: survey
      t_s: 100.0
    - id: WP-2
      lat: 35.1500
      lon: -79.0090
      alt_m: 50.0
      role: survey
      t_s: 50.0
    - id: WP-RTL
      lat: 35.1400
      lon: -79.0110
      alt_m: 30.0
      role: rtl
      t_s: 200.0
  constraints:
    max_alt_m: 120.0
    min_alt_m: 5.0
    require_rtl: true
    max_range_m: 5000.0
expected_valid: false
expected_error_contains: "VIOL-TIMESTAMP-ORDER"
