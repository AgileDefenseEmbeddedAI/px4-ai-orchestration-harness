name: "No RTL"
description: "Mission where vehicle has no return-to-launch waypoint — must be rejected"
mig:
  version: "1.0"
  mission_id: "MSN-ADV002"
  intent: "Survey the target area"
  vehicles:
    - id: UAV-1
      vehicle_type: multirotor
      sitl_target: gz_x500
      mavlink_sysid: 1
      waypoints: ["WP-1"]
  waypoints:
    - id: WP-1
      lat: 35.1490
      lon: -79.0100
      alt_m: 50.0
      role: survey
  constraints:
    max_alt_m: 120.0
    min_alt_m: 5.0
    require_rtl: true
    max_range_m: 5000.0
expected_valid: false
expected_error_contains: "RTL"
