<!doctype html>
<!-- @dsCard group="Components" name="Components — Feature cards" subtitle="Featured + standard 3-col capability cards" viewport="700x230" -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#061033;font-family:var(--font-primary);color:#fff;}
  .wrap{padding:24px;display:flex;gap:16px;}
  .card{background:#0b2451;padding:24px;flex:1;display:flex;flex-direction:column;gap:20px;min-height:180px;}
  .card.featured{background:linear-gradient(180deg,#1f3864 0%,#061033 100%);}
  .icon{width:32px;height:32px;}
  .title{font-size:20px;font-weight:500;line-height:1.2;}
  .desc{font-size:13px;font-weight:400;line-height:1.5;color:rgba(255,255,255,.85);}
</style>
</head>
<body>
<div class="wrap">
  <div class="card featured">
    <svg class="icon" viewBox="0 0 32 32"><rect x="5" y="5" width="9" height="9" fill="white"/><rect x="18" y="5" width="9" height="9" fill="white"/><rect x="5" y="18" width="9" height="9" fill="white"/><rect x="18" y="18" width="9" height="9" fill="white"/></svg>
    <div><div class="title">Digital Transformation</div><div class="desc">Modernize operations with advanced, secure technology.</div></div>
  </div>
  <div class="card">
    <svg class="icon" viewBox="0 0 32 32"><path d="M16 4v24M10 10h12M10 22h12" stroke="white" fill="none" stroke-width="2"/></svg>
    <div><div class="title">Cyber</div><div class="desc">Defense against advanced and emerging threats.</div></div>
  </div>
  <div class="card">
    <svg class="icon" viewBox="0 0 32 32"><circle cx="10" cy="16" r="3" fill="white"/><circle cx="22" cy="10" r="3" fill="white"/><circle cx="22" cy="22" r="3" fill="white"/><line x1="13" y1="15" x2="20" y2="11" stroke="white" stroke-width="1.5"/><line x1="13" y1="17" x2="20" y2="21" stroke="white" stroke-width="1.5"/></svg>
    <div><div class="title">Data / AI</div><div class="desc">Analytics that accelerate decision-making.</div></div>
  </div>
</div>
</body>
</html>
