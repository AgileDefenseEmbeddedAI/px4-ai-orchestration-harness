<!doctype html>

<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#061033;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#fff;}
  .wrap{padding:28px 32px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}

  .icon{width:88px;height:88px;display:flex;align-items:center;justify-content:center;background:#0b2451;}
  .icon img{width:48px;height:48px;}
  .lbl{font-size:13px;font-weight:500;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="cell"><div class="icon"><img src="../assets/icon-digital-transformation.svg"></div><div class="lbl">Digital Transformation</div></div>
  <div class="cell"><div class="icon"><img src="../assets/icon-data-analytics.svg"></div><div class="lbl">Data Analytics</div></div>
  <div class="cell"><div class="icon"><img src="../assets/icon-cyber.svg"></div><div class="lbl">Cyber</div></div>
</div>
</body>
</html>
