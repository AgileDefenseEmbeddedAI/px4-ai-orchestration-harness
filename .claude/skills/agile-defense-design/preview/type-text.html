<!doctype html>
<!-- @dsCard group="Type" name="Type — Text & UI" subtitle="H3, H4, sidebar, body, nav specimens" viewport="700x260" -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#061033;color:#fff;font-family:var(--font-primary);}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:baseline;gap:20px;}
  .label{width:100px;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#a9d8fb;font-weight:700;flex-shrink:0;}
  .meta{font-size:11px;color:rgba(255,255,255,.5);font-family:ui-monospace,Menlo,monospace;margin-left:auto;flex-shrink:0;}
  .sample{line-height:1.2;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><div class="label">H3</div><div class="sample" style="font-size:24px;font-weight:500">Digital Transformation</div><div class="meta">32/500</div></div>
  <div class="row"><div class="label">H4</div><div class="sample" style="font-size:20px;font-weight:500">Vertical-Specific Applications</div><div class="meta">24/500</div></div>
  <div class="row"><div class="label">Sidebar</div><div class="sample" style="font-size:18px;font-weight:500">Login, CAC, and Identity Friction</div><div class="meta">20/500</div></div>
  <div class="row"><div class="label">Body</div><div class="sample" style="font-size:16px;font-weight:400;line-height:1.5">Advanced data analytics solutions delivering insights.</div><div class="meta">17/400</div></div>
  <div class="row"><div class="label">Nav</div><div class="sample" style="font-size:13px;font-weight:500;letter-spacing:.02em">CAPABILITIES&nbsp;&nbsp;AGILE LABS&nbsp;&nbsp;CAREERS</div><div class="meta">14/500</div></div>
</div>
</body>
</html>
