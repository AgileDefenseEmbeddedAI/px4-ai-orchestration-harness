<!doctype html>
<!-- @dsCard group="Brand" name="Brand — Hero treatment" subtitle="Photo + gradient + two-tone wordmark" viewport="700x220" -->
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#061033;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#fff;}
  .wrap{padding:0;height:220px;position:relative;overflow:hidden;}
  .bg{position:absolute;inset:0;background:url('../assets/hero-image.jpg') center/cover;opacity:.55;}
  .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,51,.2) 0%,rgba(6,16,51,.9) 100%);}
  .content{position:relative;padding:32px 36px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;}
  .hero{font-size:72px;font-weight:500;line-height:.95;}
  .red{color:#c24841;}
  .sub{font-size:14px;color:rgba(255,255,255,.85);margin-top:8px;max-width:420px;line-height:1.4;}
</style>
</head>
<body>
<div class="wrap">
  <div class="bg"></div>
  <div class="content">
    <div class="hero"><span class="red">Always</span> Evolving</div>
    <div class="sub">Advanced capabilities and solutions tailored to the most critical national security and civilian missions.</div>
  </div>
</div>
</body>
</html>
