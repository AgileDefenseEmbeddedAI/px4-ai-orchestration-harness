name: "Dangling Waypoint Reference"
description: "Vehicle references a waypoint ID that does not exist in the waypoints list — must be rejected"
mig:
  version: "1.0"
  mission_id: "MSN-ADV006"
  intent: "Survey Alpha-7 grid"
  vehicles:
    - id: UAV-1
      vehicle_type: multirotor
      sitl_target: gz_x500
      mavlink_sysid: 1
      waypoints: ["WP-VALID", "WP-MISSING-99", "WP-RTL"]
  waypoints:
    - id: WP-VALID
      lat: 35.1490
      lon: -79.0100
      alt_m: 50.0
      role: survey
    - id: WP-RTL
      lat: 35.1400
      lon: -79.0110
      alt_m: 30.0
      role: rtl
  constraints:
    max_alt_m: 120.0
    min_alt_m: 5.0
    require_rtl: true
    max_range_m: 5000.0
expected_valid: false
expected_error_contains: "WP-MISSING-99"
