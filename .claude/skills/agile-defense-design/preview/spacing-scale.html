<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing — Scale" subtitle="xs–4xl spacing tokens, 8→120 px" viewport="700x340" -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#061033;color:#fff;font-family:var(--font-primary);}
  .wrap{padding:32px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;align-items:center;gap:16px;}
  .bar{background:#d23c3a;height:18px;flex-shrink:0;}
  .label{font-size:12px;font-family:ui-monospace,Menlo,monospace;width:56px;color:rgba(255,255,255,.7);flex-shrink:0;}
  .px{font-size:11px;color:rgba(255,255,255,.4);margin-left:auto;font-family:ui-monospace,Menlo,monospace;}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><div class="label">xs</div><div class="bar" style="width:8px"></div><div class="px">8 px</div></div>
  <div class="row"><div class="label">sm</div><div class="bar" style="width:16px"></div><div class="px">16 px</div></div>
  <div class="row"><div class="label">md</div><div class="bar" style="width:24px"></div><div class="px">24 px</div></div>
  <div class="row"><div class="label">lg</div><div class="bar" style="width:32px"></div><div class="px">32 px</div></div>
  <div class="row"><div class="label">xl</div><div class="bar" style="width:48px"></div><div class="px">48 px</div></div>
  <div class="row"><div class="label">2xl</div><div class="bar" style="width:64px"></div><div class="px">64 px</div></div>
  <div class="row"><div class="label">3xl</div><div class="bar" style="width:96px"></div><div class="px">96 px</div></div>
  <div class="row"><div class="label">4xl</div><div class="bar" style="width:120px"></div><div class="px">120 px</div></div>
</div>
</body>
</html>
